server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # Le serveur ne s'enregistre pas aupres de lui-meme
    register-with-eureka: false
    fetch-registry: false
  server:
    # En developpement : retirer rapidement les services arretes
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

# ---------- Supervision (Actuator / Prometheus) ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # /actuator/health/liveness et /readiness pour les sondes Kubernetes
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
