server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    # Cache du load balancer aligne sur le rafraichissement Eureka
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      # CORS gere ici, une seule fois, pour tous les services
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:4200"
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: "*"
            allow-credentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/account/**,/api/invitations/**,/api/entreprise/**,/api/admin/**,/api/users/**
        - id: voyage-service
          uri: lb://voyage-service
          predicates:
            - Path=/api/voyages/**,/api/matchs/**,/api/meta/**,/api/stats/**
        - id: forum-service
          uri: lb://forum-service
          predicates:
            - Path=/api/forum/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          # Les reponses de l'IA peuvent prendre du temps
          metadata:
            response-timeout: 120000
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Recupere la liste des services toutes les 5 s (30 s par defaut) : un service qui vient
    # de demarrer est joignable plus vite via la gateway
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

app:
  jwt:
    # Meme cle que les microservices : la gateway verifie la signature des jetons
    secret: ${JWT_SECRET:dm95YWdlcy1hZmZhaXJlcy1zZWNyZXQta2V5LXBvdXItbGUtcHJvamV0LWp3dC0yMDI2LWFuZ3VsYXItc3ByaW5n}

# ---------- Supervision (Actuator / Prometheus) ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # /actuator/health/liveness et /readiness pour les sondes Kubernetes
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
