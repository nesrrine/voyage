server:
  port: 8084

spring:
  application:
    name: ai-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 15000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:dm95YWdlcy1hZmZhaXJlcy1zZWNyZXQta2V5LXBvdXItbGUtcHJvamV0LWp3dC0yMDI2LWFuZ3VsYXItc3ByaW5n}
  ai:
    # La cle est lue dans la variable d'environnement ANTHROPIC_API_KEY (ne jamais l'ecrire ici)
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5

# ---------- Resilience4j : disjoncteur sur les appels OpenFeign ----------
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        # Seules les pannes (service arrete, 5xx, delai depasse) ouvrent le circuit, pas les refus metier
        record-failure-predicate: com.voyagesaffaires.common.feign.PanneDistante
  timelimiter:
    configs:
      default:
        timeout-duration: 10s

# ---------- Supervision (Actuator / Prometheus) ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # /actuator/health/liveness et /readiness pour les sondes Kubernetes
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
