server:
  port: 8084

spring:
  application:
    name: ai-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 15000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:dm95YWdlcy1hZmZhaXJlcy1zZWNyZXQta2V5LXBvdXItbGUtcHJvamV0LWp3dC0yMDI2LWFuZ3VsYXItc3ByaW5n}
  ai:
    # La cle est lue dans la variable d'environnement ANTHROPIC_API_KEY (ne jamais l'ecrire ici)
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
