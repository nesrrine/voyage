server:
  port: 8082

spring:
  application:
    name: voyage-service
  # Base propre a ce microservice (H2 fichier). Pour MySQL :
  # url: jdbc:mysql://localhost:3306/va_voyages?createDatabaseIfNotExist=true&serverTimezone=UTC
  datasource:
    url: jdbc:h2:file:./data/voyagedb;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:dm95YWdlcy1hZmZhaXJlcy1zZWNyZXQta2V5LXBvdXItbGUtcHJvamV0LWp3dC0yMDI2LWFuZ3VsYXItc3ByaW5n}
  matching:
    # Score minimum (sur 100) pour qu'un voyage soit propose comme partenaire
    seuil: 40
  demo-data: true
