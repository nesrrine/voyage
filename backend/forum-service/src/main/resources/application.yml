server:
  port: 8083

spring:
  application:
    name: forum-service
  # Base propre a ce microservice (H2 fichier). Pour MySQL :
  # url: jdbc:mysql://localhost:3306/va_forum?createDatabaseIfNotExist=true&serverTimezone=UTC
  datasource:
    url: jdbc:h2:file:./data/forumdb;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:dm95YWdlcy1hZmZhaXJlcy1zZWNyZXQta2V5LXBvdXItbGUtcHJvamV0LWp3dC0yMDI2LWFuZ3VsYXItc3ByaW5n}
  demo-data: true

# ---------- Supervision (Actuator / Prometheus) ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # /actuator/health/liveness et /readiness pour les sondes Kubernetes
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
