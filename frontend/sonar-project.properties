# Analyse SonarQube du frontend Angular (lancee par le pipeline Jenkins : sonar-scanner)
sonar.projectKey=voyages-affaires-frontend
sonar.projectName=Voyages & Affaires - Frontend
sonar.sourceEncoding=UTF-8
# Utiliser le Java fourni par l'image sonar-scanner-cli (pas de telechargement d'un JRE depuis le serveur)
sonar.scanner.skipJreProvisioning=true

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/app/testing/**,src/main.ts
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Couverture produite par Karma (npm run test:ci)
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
