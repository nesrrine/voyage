# Sert l'application Angular et redirige /api vers l'API Gateway.
# Le nom "api-gateway" est celui du service Docker Compose et du Service Kubernetes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Le nom est resolu au demarrage par le DNS du conteneur (Docker) ou du cluster (Kubernetes) :
    # le Service "api-gateway" doit exister avant le frontend (ordre respecte par compose et deploy.sh).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Les reponses de l'IA peuvent prendre du temps
        proxy_read_timeout 120s;
    }

    # Fichiers statiques versionnes par Angular : cache long
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routes Angular (/voyages, /forum/3...) : renvoyer index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
