# Genere par generer_manifests.py - ne pas modifier a la main
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: voyages-affaires
  labels:
    app: ai-service
    app.kubernetes.io/part-of: voyages-affaires
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # mise a jour sans interruption
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8084"
    spec:
      containers:
        - name: ai-service
          image: __REGISTRY__/va-ai-service:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: va-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: va-secrets, key: JWT_SECRET }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: va-secrets, key: ANTHROPIC_API_KEY }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          # Demarrage de la JVM : jusqu'a 3 minutes avant que les autres sondes prennent le relais
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: voyages-affaires
  labels:
    app: ai-service
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8084
      targetPort: http
